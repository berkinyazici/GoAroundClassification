version: "3.9"

services:
  web:
    build: .
    container_name: go-around-classification-web
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=${PORT:-8000}
      - ENV=${ENV:-development}
      - MODEL_PATH=${MODEL_PATH:-models/best_model.joblib}
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
