<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Go-Around Classification</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main>
      <h1>Go-Around Classification</h1>
      <p>
        Submit one landing record from the ADS-B + METAR feature schema. The backend returns the predicted class and go-around probability.
      </p>
      <p class="notice">Loaded model: <strong>{{ model_name }}</strong></p>

      <form id="predict-form">
        <label for="features">Landing features (JSON):</label>
        <textarea id="features" name="features" rows="18">{
  "n_approaches": 1,
  "n_rwy_approached": 1,
  "glide_slope_angle": 3.0,
  "rwy_length": 3500,
  "wind_speed_knts": 18,
  "wind_dir_deg": 240,
  "wind_gust_knts": 28,
  "visibility_m": 3500,
  "temperature_deg": 12,
  "press_sea_level_p": 1012,
  "press_p": 1009,
  "month": 11,
  "day_of_week": 2,
  "hour_utc": 17,
  "airport": "EDDF",
  "runway": "25L",
  "typecode": "A320",
  "icaoaircrafttype": "L2J",
  "wtc": "M",
  "has_intersection": "False",
  "airport_country": "DE",
  "airport_region": "Europe",
  "operator_country": "DE",
  "operator_region": "Europe",
  "weather_intensity": "UNKNOWN",
  "weather_precipitation": "RA",
  "weather_desc": "SHOWERS",
  "weather_obscuration": "UNKNOWN",
  "weather_other": "UNKNOWN"
}</textarea>
        <button type="submit">Predict</button>
      </form>

      <section id="output" class="hidden">
        <h2>Prediction Result</h2>
        <pre id="result"></pre>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
