[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "go-around-classification"
version = "0.1.0"
description = "Binary pattern recognition classification and deployment for go-around prediction."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "polars>=0.20",
  "pandas>=2.0",
  "pyarrow>=13.0",
  "scikit-learn>=1.4",
  "imbalanced-learn>=0.11.0",
  "lightgbm>=4.0",
  "fastapi>=0.115",
  "uvicorn>=0.23",
  "jinja2>=3.1",
  "python-multipart>=0.0.6",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "mlflow>=2.5",
  "pytest>=8.0",
  "ruff>=0.0.285",
  "tqdm>=4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
